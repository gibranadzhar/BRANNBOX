<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANNBOX - Permanent Vault</title>
    <style>
        body { 
            background: radial-gradient(circle at top, #1e1b4b 0%, #090514 100%); 
            color: #ffffff; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            box-sizing: border-box; 
        }
        .hidden { display: none !important; }
        
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; transition: all 0.2s ease; }
        button:active { transform: scale(0.95); }
        
        .input-group { position: relative; margin-bottom: 18px; width: 100%; box-sizing: border-box; }
        input { 
            width: 100%; 
            padding: 12px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            border-radius: 10px; 
            font-size: 14px; 
            box-sizing: border-box; 
        }
        input:focus { border-color: #3b82f6; background: rgba(255, 255, 255, 0.08); outline: none; }
        label { display: block; text-align: left; font-size: 11px; color: #a5b4fc; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; }

        .eye-btn { position: absolute; right: 12px; top: 34px; background: none; border: none; color: #64748b; cursor: pointer; font-weight: bold; font-size: 12px;}

        .auth-box { 
            background: rgba(15, 12, 30, 0.65); 
            backdrop-filter: blur(16px); 
            padding: 35px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            margin-top: 50px; 
        }
        h1 { background: linear-gradient(45deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 5px 0; font-size: 36px; font-weight: 900; }
        .slogan { color: #94a3b8; font-size: 12px; margin-bottom: 25px; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; width: 50%; }
        .btn-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; width: 50%; }
        .btn-full { width: 100% !important; }

        .dashboard { width: 100%; max-width: 850px; margin-top: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 12, 30, 0.6); padding: 15px 25px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 25px; }
        .logo-text { font-size: 22px; font-weight: 900; background: linear-gradient(45deg, #3b82f6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .upload-zone { background: rgba(255, 255, 255, 0.02); border: 2px dashed rgba(255, 255, 255, 0.1); padding: 35px; border-radius: 16px; text-align: center; margin-bottom: 30px; }
        .btn-choose { background: #4f46e5; color: white; display: inline-block; padding: 12px 26px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-emerald { background: #10b981; color: white; }

        .gallery-menu { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid-gallery { display: grid; grid-template-cols: repeat(2, 1fr); gap: 18px; width: 100%; }
        @media (min-width: 600px) { .grid-gallery { grid-template-cols: repeat(3, 1fr); } }
        
        .media-card { background-color: #000; height: 190px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; position: relative; }
        .media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; }
        .selected-card { border-color: #3b82f6 !important; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5) !important; }
        
        .video-badge { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.75); padding: 6px; border-radius: 8px; }
        .check-badge { position: absolute; top: 12px; left: 12px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; background-color: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
        .checked-active { background-color: #3b82f6 !important; border-color: #3b82f6 !important; }
        .hover-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; font-size: 13px; font-weight: bold; }
        .media-card:hover .hover-overlay { opacity: 1; }

        .modal { display: none; position: fixed; inset: 0; background-color: rgba(5, 3, 13, 0.96); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { max-width: 100%; max-height: 70vh; border-radius: 12px; }
        .btn-close { position: absolute; top: 20px; right: 20px; background-color: #1e293b; color: white; padding: 10px 22px; border-radius: 20px; }
        .btn-delete-card { position: absolute; top: 12px; right: 12px; background: rgba(239, 68, 68, 0.8); color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; z-index: 5; }
    </style>
</head>
<body>

    <div id="auth-section" class="auth-box">
        <h1>BRANNBOX</h1>
        <p id="auth-title">Masuk ke Galeri</p>
        <p class="slogan">Penyimpanan video & foto permanen aman dan anti-hilang.</p>
        
        <div>
            <div class="input-group">
                <label>Email Anda</label>
                <input type="email" id="email" placeholder="nama@email.com" value="test@gmail.com">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" value="123">
                <button type="button" class="eye-btn" onclick="togglePasswordView()">LIHAT</button>
            </div>
            
            <div id="security-box" class="hidden">
                <div class="input-group">
                    <label style="color:#fbbf24;">*Pertanyaan Pemulihan</label>
                    <input type="text" id="security-answer" placeholder="Nama hewan peliharaan pertama?">
                </div>
            </div>

            <div id="action-buttons" class="btn-group">
                <button type="button" onclick="handleLogin()" class="btn-blue">Masuk</button>
                <button type="button" onclick="toggleMode(false)" class="btn-purple">Daftar Baru</button>
            </div>

            <button type="button" id="btn-submit-signup" onclick="handleSignUp()" class="btn-purple btn-full hidden">Daftarkan Akun</button>
            <button type="button" id="btn-submit-reset" onclick="handleResetPassword()" class="btn-blue btn-full hidden" style="background:#b45309">Pulihkan Akun</button>
            
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px;">
                <button type="button" id="btn-forgot-link" onclick="toggleMode('forgot')" style="background:none; border:none; color:#94a3b8; font-size:12px; text-decoration:underline; cursor:pointer;">Lupa Password?</button>
                <button type="button" id="btn-back-link" onclick="toggleMode(true)" class="hidden" style="background:none; border:none; color:#3b82f6; font-size:12px; font-weight:bold; cursor:pointer;">← Kembali</button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="dashboard hidden">
        <div class="header">
            <span class="logo-text">BRANNBOX</span>
            <span id="user-email" style="font-size:13px; color:#cbd5e1;"></span>
            <button type="button" onclick="handleLogout()" style="background:#ef4444; color:white; border-radius:8px; padding:6px 12px;">Keluar</button>
        </div>

        <div class="upload-zone">
            <p style="margin: 0 0 18px 0; color:#e2e8f0;">Unggah File (Tersimpan Permanen di Browser Anda):</p>
            <input type="file" id="file-chooser" accept="image/*,video/*" multiple class="hidden" onchange="previewFileName()">
            <label for="file-chooser" class="btn-choose">+ Pilih File</label>
            <button type="button" onclick="uploadMultipleFiles()" class="btn-emerald" style="margin-left: 8px;">Simpan Permanen</button>
            <p id="file-name-preview" style="color:#fbbf24; font-size:13px; margin-top:12px;"></p>
        </div>

        <div class="gallery-menu">
            <h3 style="margin:0;">Koleksi Vault</h3>
            <div style="display:flex; gap:8px;">
                <button type="button" id="btn-toggle-select" onclick="toggleSelectMode()" style="background:#334155; color:white;">Pilih Banyak</button>
                <button type="button" id="btn-download-selected" onclick="downloadSelectedFiles()" class="btn-blue hidden">Download (0)</button>
            </div>
        </div>

        <div id="gallery" class="grid-gallery"></div>
    </div>

    <div id="media-modal" class="modal">
        <button type="button" onclick="closeMediaModal()" class="btn-close">✕ Tutup</button>
        <div style="width:100%; max-width:720px; display:flex; justify-content:center;">
            <img id="modal-img" class="modal-content hidden">
            <video id="modal-video" controls class="modal-content hidden"></video>
        </div>
        <p id="modal-filename" style="font-size:13px; color:#94a3b8; margin-top:15px;"></p>
    </div>

    <script>
        // INISIALISASI INDEXEDDB (Database Permanen Browser)
        let db;
        const request = indexedDB.open("BrannBoxDatabase", 2);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("users")) {
                db.createObjectStore("users", { keyPath: "email" });
            }
            if (!db.objectStoreNames.contains("gallery")) {
                db.createObjectStore("gallery", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            // CEK SESSION LOGIN AKTIF (Auto-Login pas di-refresh)
            const savedSession = localStorage.getItem("brannbox_session");
            if (savedSession) {
                currentActiveUser = savedSession;
                jalankanDashboard();
            }
        };

        let memoryGallery = []; 
        let currentActiveUser = null;
        let isSelectMode = false;
        let selectedIndexes = [];

        function togglePasswordView() {
            const passInput = document.getElementById('password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        function toggleMode(mode) {
            document.getElementById('security-box').classList.toggle('hidden', mode === true);
            document.getElementById('action-buttons').classList.toggle('hidden', mode !== true);
            document.getElementById('btn-submit-signup').classList.toggle('hidden', mode !== false);
            document.getElementById('btn-submit-reset').classList.toggle('hidden', mode !== 'forgot');
            document.getElementById('btn-forgot-link').classList.toggle('hidden', mode !== true);
            document.getElementById('btn-back-link').classList.toggle('hidden', mode === true);
            document.getElementById('auth-title').innerText = mode === true ? "Masuk ke Galeri" : (mode === false ? "Daftar Akun Baru" : "Pemulihan Akun");
        }

        function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const answer = document.getElementById('security-answer').value.trim().toLowerCase();
            if (!email || !password || !answer) return alert('Lengkapi kolom bray!');

            const tx = db.transaction("users", "readwrite");
            const store = tx.objectStore("users");
            
            store.put({ email: email, password: password, securityAnswer: answer });
            tx.oncomplete = function() {
                alert('Pendaftaran Sukses Perndata Terproteksi!');
                toggleMode(true);
            };
        }

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Akun Bawaan Demo Pertama Kali
            if (email === "test@gmail.com" && password === "123") {
                currentActiveUser = email;
                localStorage.setItem("brannbox_session", email);
                jalankanDashboard();
                return;
            }

            const tx = db.transaction("users", "readonly");
            const store = tx.objectStore("users");
            const req = store.get(email);

            req.onsuccess = function() {
                const user = req.result;
                if (user && user.password === password) {
                    currentActiveUser = email;
                    localStorage.setItem("brannbox_session", email); // Simpan session login
                    jalankanDashboard();
                } else {
                    alert('Email atau Password salah bray!');
                }
            };
        }

        function handleResetPassword() {
            const email = document.getElementById('email').value.trim();
            const answer = document.getElementById('security-answer').value.trim().toLowerCase();

            const tx = db.transaction("users", "readonly");
            const store = tx.objectStore("users");
            const req = store.get(email);

            req.onsuccess = function() {
                const user = req.result;
                if (user && user.securityAnswer === answer) {
                    alert(`Password Anda: ${user.password}`);
                    toggleMode(true);
                } else {
                    alert('Data pemulihan tidak cocok!');
                }
            };
        }

        function jalankanDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-email').innerText = currentActiveUser;
            ambilDataMediaDariDB();
        }

        function handleLogout() {
            localStorage.removeItem("brannbox_session"); // Hapus session login
            // Bersihkan sisa tautan memori
            memoryGallery.forEach(item => URL.revokeObjectURL(item.blobUrl));
            memoryGallery = [];
            currentActiveUser = null;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }

        function previewFileName() {
            const files = document.getElementById('file-chooser').files;
            document.getElementById('file-name-preview').innerText = `${files.length} file dipilih.`;
        }

        function uploadMultipleFiles() {
            const files = document.getElementById('file-chooser').files;
            if (files.length === 0) return alert('Pilih file dulu!');

            const tx = db.transaction("gallery", "readwrite");
            const store = tx.objectStore("gallery");

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                // Simpan FILE BLOB ASLI ke harddisk browser secara utuh
                store.put({
                    user: currentActiveUser,
                    name: file.name,
                    type: file.type,
                    fileData: file
                });
            }

            tx.oncomplete = function() {
                document.getElementById('file-name-preview').innerText = "Permanen tersimpan di Box!";
                document.getElementById('file-chooser').value = "";
                ambilDataMediaDariDB();
            };
        }

        function ambilDataMediaDariDB() {
            // Bersihkan sisa ObjectURL lama biar memory leak tidak terjadi
            memoryGallery.forEach(item => URL.revokeObjectURL(item.blobUrl));
            memoryGallery = [];

            const tx = db.transaction("gallery", "readonly");
            const store = tx.objectStore("gallery");
            const req = store.openCursor();

            req.onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    if (cursor.value.user === currentActiveUser) {
                        const fileObj = cursor.value;
                        // Bangkitkan virtual url dari file data asli di database
                        const vUrl = URL.createObjectURL(fileObj.fileData);
                        memoryGallery.push({
                            id: fileObj.id,
                            type: fileObj.type,
                            name: fileObj.name,
                            blobUrl: vUrl
                        });
                    }
                    cursor.continue();
                } else {
                    tampilkanMedia();
                }
            };
        }

        function hapusSingleFile(id, event) {
            event.stopPropagation(); // Mencegah popup video terbuka pas klik hapus
            if(!confirm("Hapus file ini secara permanen dari browser?")) return;

            const tx = db.transaction("gallery", "readwrite");
            const store = tx.objectStore("gallery");
            store.delete(id);

            tx.oncomplete = function() {
                ambilDataMediaDariDB();
            };
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedIndexes = [];
            document.getElementById('btn-toggle-select').innerText = isSelectMode ? "Batal" : "Pilih Banyak";
            document.getElementById('btn-toggle-select').style.backgroundColor = isSelectMode ? "#dc2626" : "#334155";
            document.getElementById('btn-download-selected').classList.toggle('hidden', !isSelectMode);
            tampilkanMedia();
        }

        function handleCardClick(index) {
            if (isSelectMode) {
                const idx = selectedIndexes.indexOf(index);
                if (idx > -1) selectedIndexes.splice(idx, 1);
                else selectedIndexes.push(index);
                document.getElementById('btn-download-selected').innerText = `Download (${selectedIndexes.length})`;
                tampilkanMedia();
            } else {
                const item = memoryGallery[index];
                const modal = document.getElementById('media-modal');
                const isVideo = item.type && item.type.startsWith('video/');
                
                document.getElementById('modal-filename').innerText = item.name;
                document.getElementById('modal-img').classList.toggle('hidden', isVideo);
                document.getElementById('modal-video').classList.toggle('hidden', !isVideo);

                if (isVideo) {
                    document.getElementById('modal-video').src = item.blobUrl;
                    document.getElementById('modal-video').play();
                } else {
                    document.getElementById('modal-img').src = item.blobUrl;
                }
                modal.style.
