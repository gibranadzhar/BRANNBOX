<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Rahasia - Advance Download</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6 font-sans">

    <div id="auth-section" class="max-w-md mx-auto mt-20 bg-gray-900 p-8 rounded-2xl border border-gray-800 shadow-xl">
        <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center text-blue-400">MASUK KE GALERI</h2>
        
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email Anda" class="w-full p-3 bg-gray-800 rounded-xl border border-gray-700 text-white focus:outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 bg-gray-800 rounded-xl border border-gray-700 text-white focus:outline-none">
            
            <div id="security-box" class="hidden space-y-4">
                <p class="text-xs text-yellow-400 font-semibold">*Pertanyaan Pemulihan jika Lupa Password:</p>
                <input type="text" id="security-answer" placeholder="Siapa nama hewan peliharaan pertama Anda?" class="w-full p-3 bg-gray-800 rounded-xl border border-gray-700 text-white focus:outline-none">
            </div>

            <div id="action-buttons" class="flex gap-2">
                <button onclick="handleLogin()" id="btn-login" class="w-1/2 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold transition">Masuk</button>
                <button onclick="toggleMode(false)" id="btn-goto-signup" class="w-1/2 bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-semibold transition">Daftar Baru</button>
            </div>

            <button onclick="handleSignUp()" id="btn-submit-signup" class="hidden w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-semibold transition">Daftarkan Akun</button>
            <button onclick="handleResetPassword()" id="btn-submit-reset" class="hidden w-full bg-yellow-600 hover:bg-yellow-500 py-3 rounded-xl font-semibold text-gray-950 transition">Pulihkan Password</button>
            
            <div class="text-center pt-2 space-y-2">
                <button onclick="toggleMode('forgot')" id="btn-forgot-link" class="block w-full text-sm text-gray-400 hover:underline">Lupa Password?</button>
                <button onclick="toggleMode(true)" id="btn-back-link" class="hidden text-sm text-blue-400 hover:underline">← Kembali ke Login</button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-gray-900 p-4 rounded-xl border border-gray-800">
            <div>
                <p class="text-xs text-gray-400">Akun Aktif:</p>
                <span id="user-email" class="font-semibold text-blue-400"></span>
            </div>
            <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-xl text-sm font-semibold transition">Keluar</button>
        </div>

        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 text-center mb-8">
            <p class="mb-4 text-gray-300">Pilih satu atau banyak file sekaligus untuk disimpan</p>
            <input type="file" id="file-chooser" accept="image/*,video/*" multiple class="hidden" onchange="previewFileName()">
            <label for="file-chooser" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:opacity-90 px-6 py-3 rounded-xl cursor-pointer font-semibold inline-block">
                + Pilih File
            </label>
            <button onclick="uploadMultipleFiles()" class="ml-2 bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-semibold transition">Simpan Semua</button>
            <p id="file-name-preview" class="text-sm mt-3 text-yellow-400 font-medium"></p>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold">Koleksi Anda</h3>
            <div class="space-x-2">
                <button id="btn-toggle-select" onclick="toggleSelectMode()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-xl text-sm font-semibold border border-gray-700 transition">
                    Pilih Banyak
                </button>
                <button id="btn-download-selected" onclick="downloadSelectedFiles()" class="hidden bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-sm font-semibold transition">
                    Download Terpilih (0)
                </button>
            </div>
        </div>

        <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            </div>
    </div>

    <script>
        let currentActiveUser = null;
        let isSelectMode = false;
        let selectedIndexes = [];

        window.onload = function() {
            const savedSession = localStorage.getItem('session_user');
            if (savedSession) {
                currentActiveUser = savedSession;
                masukDashboard();
            }
        };

        function toggleMode(mode) {
            const title = document.getElementById('auth-title');
            const securityBox = document.getElementById('security-box');
            const actionButtons = document.getElementById('action-buttons');
            const btnSubmitSignup = document.getElementById('btn-submit-signup');
            const btnSubmitReset = document.getElementById('btn-submit-reset');
            const btnForgotLink = document.getElementById('btn-forgot-link');
            const btnBackLink = document.getElementById('btn-back-link');
            const passwordInput = document.getElementById('password');

            if (mode === true) {
                title.innerText = "MASUK KE GALERI";
                securityBox.classList.add('hidden');
                actionButtons.classList.remove('hidden');
                btnSubmitSignup.classList.add('hidden');
                btnSubmitReset.classList.add('hidden');
                btnForgotLink.classList.remove('hidden');
                btnBackLink.classList.add('hidden');
                passwordInput.classList.remove('hidden');
            } else if (mode === false) {
                title.innerText = "DAFTAR AKUN BARU";
                securityBox.classList.remove('hidden');
                actionButtons.classList.add('hidden');
                btnSubmitSignup.classList.remove('hidden');
                btnSubmitReset.classList.add('hidden');
                btnForgotLink.classList.add('hidden');
                btnBackLink.classList.remove('hidden');
                passwordInput.classList.remove('hidden');
            } else if (mode === 'forgot') {
                title.innerText = "PEMULIHAN AKUN";
                securityBox.classList.remove('hidden');
                actionButtons.classList.add('hidden');
                btnSubmitSignup.classList.add('hidden');
                btnSubmitReset.classList.remove('hidden');
                btnForgotLink.classList.add('hidden');
                btnBackLink.classList.remove('hidden');
                passwordInput.classList.add('hidden');
            }
        }

        function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const answer = document.getElementById('security-answer').value.trim().toLowerCase();

            if (!email || !password || !answer) return alert('Semua kolom wajib diisi!');

            if (localStorage.getItem('user_' + email)) {
                return alert('Email ini sudah terdaftar! Silakan login.');
            }

            const userData = { password: password, securityAnswer: answer };
            localStorage.setItem('user_' + email, JSON.stringify(userData));

            alert('Pendaftaran berhasil! Silakan masuk.');
            toggleMode(true);
        }

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const storedData = localStorage.getItem('user_' + email);
            if (!storedData) return alert('Akun tidak ditemukan. Silakan daftar dulu!');

            const account = JSON.parse(storedData);
            if (account.password !== password) {
                return alert('Password salah! Akses ditolak.');
            }

            currentActiveUser = email;
            localStorage.setItem('session_user', email); 
            masukDashboard();
        }

        function handleResetPassword() {
            const email = document.getElementById('email').value.trim();
            const answer = document.getElementById('security-answer').value.trim().toLowerCase();

            const storedData = localStorage.getItem('user_' + email);
            if (!storedData) return alert('Email tidak terdaftar!');

            const account = JSON.parse(storedData);
            if (account.securityAnswer === answer) {
                alert(`Jawaban Benar! Password Anda adalah: ${account.password}`);
                toggleMode(true);
            } else {
                alert('Jawaban keamanan salah! Gagal memulihkan password.');
            }
        }

        function masukDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-email').innerText = currentActiveUser;
            tampilkanMedia();
        }

        function handleLogout() {
            currentActiveUser = null;
            localStorage.removeItem('session_user'); 
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('security-answer').value = '';
        }

        function previewFileName() {
            const files = document.getElementById('file-chooser').files;
            const preview = document.getElementById('file-name-preview');
            if (files.length > 0) preview.innerText = `${files.length} file siap di-upload.`;
        }

        function uploadMultipleFiles() {
            const fileInput = document.getElementById('file-chooser');
            const files = fileInput.files;
            if (files.length === 0) return alert('Pilih file-nya dulu!');

            const storageKey = 'gallery_' + currentActiveUser;
            let userGallery = JSON.parse(localStorage.getItem(storageKey)) || [];
            const preview = document.getElementById('file-name-preview');
            let filesProcessed = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onloadend = function () {
                    userGallery.push({ type: file.type, name: file.name, data: reader.result });
                    filesProcessed++;

                    if (filesProcessed === files.length) {
                        try {
                            localStorage.setItem(storageKey, JSON.stringify(userGallery));
                            preview.innerText = "Semua file berhasil disimpan!";
                            fileInput.value = ""; 
                            setTimeout(() => preview.innerText = "", 2000);
                            tampilkanMedia();
                        } catch (e) {
                            alert('Memori penuh! Kurangi jumlah/ukuran file.');
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // === FITUR BARU: AKTIFKAN/MATIKAN MODE PILIH BANYAK ===
        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedIndexes = [];
            
            const btnToggle = document.getElementById('btn-toggle-select');
            const btnDownload = document.getElementById('btn-download-selected');

            if(isSelectMode) {
                btnToggle.innerText = "Batal";
                btnToggle.classList.replace('bg-gray-800', 'bg-red-600');
                btnDownload.classList.remove('hidden');
                updateDownloadButtonText();
            } else {
                btnToggle.innerText = "Pilih Banyak";
                btnToggle.classList.replace('bg-red-600', 'bg-gray-800');
                btnDownload.classList.add('hidden');
            }
            tampilkanMedia(); // Muat ulang tampilan galeri untuk memunculkan checkbox
        }

        // TANGANI AKSI KLIK PADA FOTO/VIDEO
        function handleMediaClick(index, name, dataUrl) {
            if (isSelectMode) {
                // Jika mode pilih banyak aktif, gunakan sistem check/uncheck
                const idx = selectedIndexes.indexOf(index);
                if (idx > -1) {
                    selectedIndexes.splice(idx, 1);
                } else {
                    selectedIndexes.push(index);
                }
                updateDownloadButtonText();
                tampilkanMedia();
            } else {
                // Jika mode biasa, langsung tawarkan opsi download
                const konfirmasi = confirm(`Apakah Anda ingin mendownload file: "${name}"?`);
                if (konfirmasi) {
                    const link = document.createElement('a');
                    link.href = dataUrl;
                    link.download = name || 'download-file';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }

        function updateDownloadButtonText() {
            document.getElementById('btn-download-selected').innerText = `Download Terpilih (${selectedIndexes.length})`;
        }

        // === FITUR BARU: DOWNLOAD BANYAK SEKALIGUS (ZIP) ===
        function downloadSelectedFiles() {
            if (selectedIndexes.length === 0) return alert('Pilih minimal 1 file bray!');

            const storageKey = 'gallery_' + currentActiveUser;
            const userGallery = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            const zip = new JSZip();

            selectedIndexes.forEach((index, i) => {
                const item = userGallery[index];
                const base64Content = item.data.split(',')[1]; // Ambil data murninya saja tanpa header base64
                const extension = item.type.split('/')[1] || 'jpg';
                const fileName = item.name || `file_${i + 1}.${extension}`;
                
                zip.file(fileName, base64Content, {base64: true});
            });

            alert('Sedang memproses file menjadi ZIP, mohon tunggu sebentar...');
            
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "koleksi_vault_brann.zip");
                toggleSelectMode(); // Matikan mode pilih banyak setelah download selesai
            });
        }

        // TAMPILKAN MEDIA DENGAN FITUR SELEKSI
        function tampilkanMedia() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            const storageKey = 'gallery_' + currentActiveUser;
            const userGallery = JSON.parse(localStorage.getItem(storageKey)) || [];

            if(userGallery.length === 0) {
                gallery.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-8">Galeri kosong.</p>';
                return;
            }

            userGallery.forEach((item, index) => {
                const isChecked = selectedIndexes.includes(index);
                const isVideo = item.type.startsWith('video/');
                
                // Pembungkus kartu media
                let htmlCard = `
                    <div onclick="handleMediaClick(${index}, '${item.name || 'file'}', '${item.data}')" 
                         class="relative cursor-pointer group rounded-xl overflow-hidden border ${isChecked ? 'border-blue-500 ring-4 ring-blue-500/30' : 'border-gray-800 hover:border-gray-600'} transition bg-black h-48">
                `;

                // Komponen Media
                if (isVideo) {
                    htmlCard += `<video src="${item.data}" class="w-full h-full object-cover pointer-events-none"></video>`;
                } else {
                    htmlCard += `<img src="${item.data}" class="w-full h-full object-cover">`;
                }

                // Overlay penunjuk saat mode biasa (muncul tulisan klik untuk download)
                if (!isSelectMode) {
                    htmlCard += `
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <span class="bg-gray-900/90 text-xs px-3 py-1.5 rounded-lg border border-gray-700 font-medium tracking-wide">⬇ Klik untuk Download</span>
                        </div>
                    `;
                }

                // Kotak Centang (Hanya muncul jika Mode Pilih Banyak Aktif)
                if (isSelectMode) {
                    htmlCard += `
                        <div class="absolute top-3 left-3 w-6 h-6 rounded-full flex items-center justify-center border-2 ${isChecked ? 'bg-blue-500 border-blue-500' : 'bg-black/40 border-white'}">
                            ${isChecked ? '✓' : ''}
                        </div>
                    `;
                }

                htmlCard += `</div>`;
                gallery.innerHTML += htmlCard;
            });
        }
    </script>
</body>
</html>
