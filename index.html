<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANNBOX - Safe Vault</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; box-sizing: border-box; }
        .hidden { display: none !important; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background-color: #1f2937; border: 1px solid #374151; color: white; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        
        .auth-box { background-color: #111827; padding: 30px; border-radius: 15px; border: 1px solid #1f2937; width: 100%; max-width: 360px; text-align: center; margin-top: 40px; }
        h1 { color: #3b82f6; margin: 0 0 5px 0; font-size: 32px; font-weight: 800; }
        .slogan { color: #9ca3af; font-size: 12px; margin-bottom: 25px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn-blue { background-color: #2563eb; color: white; width: 50%; }
        .btn-purple { background-color: #7c3aed; color: white; width: 50%; }
        
        .dashboard { width: 100%; max-width: 800px; margin-top: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #111827; padding: 15px 20px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 25px; }
        .logo-text { font-size: 20px; font-weight: 900; color: #3b82f6; }
        
        .upload-zone { background-color: #111827; border: 1px solid #1f2937; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 30px; }
        .btn-choose { background-color: #4f46e5; color: white; display: inline-block; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-emerald { background-color: #059669; color: white; }
        
        .grid-gallery { display: grid; grid-template-cols: repeat(2, 1fr); gap: 15px; width: 100%; }
        @media (min-width: 600px) { .grid-gallery { grid-template-cols: repeat(3, 1fr); } }
        
        .media-card { background-color: #000; height: 180px; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; cursor: pointer; position: relative; }
        .media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-badge { position: absolute; bottom: 10px; right: 10px; background-color: rgba(0,0,0,0.7); padding: 5px; border-radius: 6px; }
        .hover-overlay { position: absolute; inset: 0; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; font-size: 12px; }
        .media-card:hover .hover-overlay { opacity: 1; }

        .modal { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { max-width: 100%; max-height: 70vh; border-radius: 8px; }
        .btn-close { position: absolute; top: 20px; right: 20px; background-color: #374151; color: white; padding: 10px 20px; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="auth-section" class="auth-box">
        <h1>BRANNBOX</h1>
        <p id="auth-title" style="font-size: 14px; font-weight: bold; color: #e5e7eb; margin-top: 5px;">Masuk ke Galeri</p>
        <p class="slogan">Memudahan Anda menyimpan foto & video secara aman.</p>
        
        <div>
            <input type="email" id="email" placeholder="Email Anda" value="test@gmail.com">
            <input type="password" id="password" placeholder="Password" value="123">
            
            <div id="action-buttons" class="btn-group">
                <button type="button" onclick="handleLogin()" class="btn-blue" style="width:100%">Masuk (Klik Sini)</button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="dashboard hidden">
        <div class="header">
            <span class="logo-text">BRANNBOX DASHBOARD</span>
            <button type="button" onclick="handleLogout()" style="background-color: #dc2626; color: white; padding: 8px 16px;">Keluar</button>
        </div>

        <div class="upload-zone">
            <p style="margin: 0 0 15px 0; color:#e5e7eb;">Pilih file video atau foto kamu:</p>
            <input type="file" id="file-chooser" accept="image/*,video/*" multiple class="hidden" onchange="previewFileName()">
            <label for="file-chooser" class="btn-choose">+ Pilih File</label>
            <button type="button" onclick="uploadMultipleFiles()" class="btn-emerald" style="margin-left: 8px;">Simpan Ke Galeri</button>
            <p id="file-name-preview" style="color: #f59e0b; font-size: 13px; margin-top: 10px;"></p>
        </div>

        <h3 style="margin-bottom:15px;">Koleksi Galeri Terbuka</h3>
        <div id="gallery" class="grid-gallery">
            </div>
    </div>

    <div id="media-modal" class="modal">
        <button type="button" onclick="closeMediaModal()" class="btn-close">✕ Tutup</button>
        <div style="width:100%; max-width:700px; display:flex; justify-content:center;">
            <img id="modal-img" class="modal-content hidden" src="">
            <video id="modal-video" controls class="modal-content hidden" src=""></video>
        </div>
        <p id="modal-filename" style="font-size:13px; color:#9ca3af; margin-top:10px;"></p>
    </div>

    <script>
        // Array penyimpanan runtime (Anti-Crash Browser)
        let memoryGallery = [];

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return alert('Isi data dulu!');

            // Langsung lolos masuk dashboard tanpa hambatan database lokal
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            tampilkanMedia();
        }

        function handleLogout() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }

        function previewFileName() {
            const files = document.getElementById('file-chooser').files;
            document.getElementById('file-name-preview').innerText = `${files.length} file terpilih.`;
        }

        function uploadMultipleFiles() {
            const fileInput = document.getElementById('file-chooser');
            const files = fileInput.files;
            if (files.length === 0) return alert('Pilih filenya dulu bray!');

            let processed = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onloadend = function() {
                    // Masukkan ke array ram memori langsung agar aman dari crash
                    memoryGallery.push({ type: file.type, name: file.name, data: reader.result });
                    processed++;

                    if (processed === files.length) {
                        document.getElementById('file-name-preview').innerText = "Berhasil masuk galeri!";
                        fileInput.value = "";
                        tampilkanMedia();
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function handleCardClick(index) {
            const item = memoryGallery[index];
            const modal = document.getElementById('media-modal');
            const modalImg = document.getElementById('modal-img');
            const modalVideo = document.getElementById('modal-video');
            
            document.getElementById('modal-filename').innerText = item.name;

            if (item.type && item.type.startsWith('video/')) {
                modalImg.classList.add('hidden');
                modalVideo.classList.remove('hidden');
                modalVideo.src = item.data;
                modalVideo.play();
            } else {
                modalVideo.classList.add('hidden');
                modalImg.classList.remove('hidden');
                modalImg.src = item.data;
            }
            modal.style.display = 'flex';
        }

        function closeMediaModal() {
            const modalVideo = document.getElementById('modal-video');
            modalVideo.pause();
            modalVideo.src = "";
            document.getElementById('media-modal').style.display = 'none';
        }

        function tampilkanMedia() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (memoryGallery.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#6b7280; font-size:14px;">Belum ada file. Silakan upload foto/video di atas!</p>';
                return;
            }

            memoryGallery.forEach((item, index) => {
                const isVideo = item.type && item.type.startsWith('video/');
                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = function() { handleCardClick(index); };

                let html = '';
                if (isVideo) {
                    html += `
                        <video src="${item.data}"></video>
                        <div class="video-badge">
                            <svg style="width:12px; height:12px; fill:#fff;" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    `;
                } else {
                    html += `<img src="${item.data}">`;
                }

                html += `<div class="hover-overlay"><span>${isVideo ? '▶ Putar Video' : '🔍 Lihat Foto'}</span></div>`;
                card.innerHTML = html;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
